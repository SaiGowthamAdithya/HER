<style>
/* Layout: one narrow centered column inside a fixed green + gold frame; rolled scrolls that unroll on tap. */
:root {
  --butter: #FBF1C4;
  --butter-lit: #FFF9DE;
  --paper: #FFFAE0;
  --green-deep: #1D5237;
  --green: #3D7A4D;
  --gold: #D4A72C;
  --gold-lit: #F0D56B;
  --ink: #2A3B2B;
  --ink-soft: #55684F;
  --font-script: "Pinyon Script", "Snell Roundhand", cursive;
  --font-serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-label: "Jost", "Helvetica Neue", Arial, sans-serif;
  --frame: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--butter-lit), var(--butter) 70%);
  background-color: var(--butter);
  color: var(--ink);
  font-family: var(--font-serif);
  font-size: 20px;
  line-height: 1.6;
  min-height: 100vh;
  padding-block: calc(var(--frame) + 40px) 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.locked { overflow: hidden; height: 100vh; }

/* ---------- frame ---------- */
.frame {
  position: fixed;
  inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  border: var(--frame) solid var(--green-deep);
  pointer-events: none;
  z-index: 40;
}
.frame::before {
  content: ""; position: absolute; inset: 6px;
  border: 2px solid var(--gold);
  outline: 1px solid var(--gold-lit);
  outline-offset: 3px;
}
.frame i {
  position: absolute; width: 22px; height: 22px;
  background: var(--gold);
  transform: rotate(45deg);
  border: 3px solid var(--green-deep);
}
.frame i:nth-child(1) { top: -20px; left: -20px; }
.frame i:nth-child(2) { top: -20px; right: -20px; }
.frame i:nth-child(3) { bottom: -20px; left: -20px; }
.frame i:nth-child(4) { bottom: -20px; right: -20px; }

/* ---------- gate ---------- */
.gate {
  position: fixed; inset: 0; z-index: 30;
  background: radial-gradient(90% 70% at 50% 30%, var(--butter-lit), var(--butter));
  display: flex; align-items: center; justify-content: center;
  padding: 40px 28px;
  text-align: center;
  transition: opacity 0.9s ease, visibility 0.9s;
}
.gate.gone { opacity: 0; visibility: hidden; }
.gate-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 420px; }
.label {
  font-family: var(--font-label); font-weight: 400; font-size: 12px;
  letter-spacing: 0.32em; text-transform: uppercase; color: var(--green);
}
.script { font-family: var(--font-script); font-weight: 400; color: var(--green-deep); line-height: 1.1; margin: 0; }
.gate h1 { font-size: clamp(56px, 16vw, 84px); }
.gate p { margin: 0; color: var(--ink-soft); font-style: italic; font-size: 21px; }
.seal-btn {
  margin-top: 14px;
  width: 112px; height: 112px; border-radius: 50%;
  border: 0; cursor: pointer; position: relative;
  background: radial-gradient(circle at 35% 30%, var(--green), var(--green-deep) 75%);
  box-shadow: 0 0 0 5px var(--gold), 0 0 0 7px var(--green-deep), 0 14px 26px rgba(29, 82, 55, 0.35);
  color: var(--gold-lit);
  font-family: var(--font-label); font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase;
  display: grid; place-items: center;
  transition: transform 0.3s ease;
}
.seal-btn:hover { transform: scale(1.05); }
.seal-btn:active { transform: scale(0.97); }
.seal-btn svg { width: 34px; height: 34px; fill: var(--gold-lit); display: block; margin-bottom: 4px; }
.seal-btn span { display: block; }
.seal-inner { display: flex; flex-direction: column; align-items: center; }

/* ---------- header ---------- */
main { max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 56px; }
.hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 12px; }
.hero h2 { font-size: clamp(54px, 15vw, 78px); }
.hero p { margin: 0; max-width: 30ch; font-style: italic; color: var(--ink-soft); font-size: 22px; text-wrap: balance; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--gold); width: min(260px, 70%); }
.divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, transparent, var(--gold)); }
.divider::after { background: linear-gradient(270deg, transparent, var(--gold)); }
.divider b { width: 9px; height: 9px; background: var(--gold); transform: rotate(45deg); display: block; }

.group { display: flex; flex-direction: column; gap: 18px; }
.group-title { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; margin-bottom: 6px; }
.group-title h3 { font-size: 40px; }

/* ---------- scrolls ---------- */
.scroll { display: flex; flex-direction: column; }
.rod {
  height: 18px; border-radius: 9px; position: relative; z-index: 2;
  background: linear-gradient(180deg, var(--gold-lit), var(--gold) 45%, #A98216 100%);
  box-shadow: 0 3px 8px rgba(29, 82, 55, 0.25);
}
.rod::before, .rod::after {
  content: ""; position: absolute; top: -3px; bottom: -3px; width: 14px; border-radius: 7px;
  background: linear-gradient(180deg, var(--green), var(--green-deep));
}
.rod::before { left: -6px; }
.rod::after { right: -6px; }

.scroll-head {
  all: unset; box-sizing: border-box; cursor: pointer;
  display: flex; align-items: center; gap: 16px;
  padding: 16px 22px 16px 16px;
  min-height: 76px;
  border-radius: 40px;
  background: linear-gradient(180deg, var(--gold-lit) 0%, var(--gold) 50%, #B28A1B 100%);
  box-shadow: 0 8px 18px rgba(29, 82, 55, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  position: relative; z-index: 2;
  transition: transform 0.25s ease, border-radius 0.4s ease, box-shadow 0.25s ease;
}
.scroll-head:hover { transform: translateY(-2px); }
.scroll-head:focus-visible { outline: 3px solid var(--green-deep); outline-offset: 4px; }
.scroll.open .scroll-head { border-radius: 18px 18px 6px 6px; }
.scroll-head .wax {
  flex: none; width: 46px; height: 46px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--green), var(--green-deep) 80%);
  box-shadow: 0 0 0 3px var(--gold-lit), 0 0 0 4px var(--green-deep);
  display: grid; place-items: center; color: var(--gold-lit);
  font-family: var(--font-serif); font-weight: 600; font-size: 24px; line-height: 1;
}
.wax svg { width: 22px; height: 22px; fill: var(--gold-lit); }
.head-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.head-text strong { font-weight: 600; font-size: 23px; line-height: 1.2; color: var(--green-deep); text-wrap: balance; }
.head-text small { font-family: var(--font-label); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(29, 82, 55, 0.75); margin-top: 3px; }
.chev { flex: none; width: 14px; height: 14px; border-right: 3px solid var(--green-deep); border-bottom: 3px solid var(--green-deep); transform: rotate(45deg) translate(-2px, -2px); transition: transform 0.4s ease; }
.scroll.open .chev { transform: rotate(225deg) translate(-2px, -2px); }

.scroll-body {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows 0.9s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.scroll.open .scroll-body { grid-template-rows: 1fr; }
.scroll-clip { overflow: hidden; min-height: 0; }
.paper {
  margin-inline: 14px;
  background:
    linear-gradient(180deg, rgba(212, 167, 44, 0.16), transparent 14%, transparent 86%, rgba(212, 167, 44, 0.16)),
    var(--paper);
  border-inline: 2px solid var(--gold);
  box-shadow: inset 0 0 0 6px var(--paper), inset 0 0 0 7px rgba(61, 122, 77, 0.45), 0 10px 24px rgba(29, 82, 55, 0.15);
  padding: 34px 30px 30px;
  opacity: 0; transform: translateY(-14px);
  transition: opacity 0.7s ease 0.25s, transform 0.7s ease 0.25s;
}
.scroll.open .paper { opacity: 1; transform: none; }
.paper h4 { font-family: var(--font-script); font-weight: 400; font-size: 38px; color: var(--green-deep); margin: 0 0 14px; line-height: 1.15; }
.paper p { margin: 0 0 1em; font-size: 21px; line-height: 1.7; }
.paper .sign { font-family: var(--font-script); font-size: 34px; color: var(--green-deep); text-align: right; margin: 10px 0 0; line-height: 1.2; }
.paper .answer-label { font-family: var(--font-label); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--green); margin: 0 0 12px; display: block; }
.scroll-foot { margin-top: -2px; }
.scroll-foot .rod { margin-inline: 8px; }
.scroll-foot-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.9s cubic-bezier(0.25, 0.8, 0.25, 1); }
.scroll.open .scroll-foot-wrap { grid-template-rows: 1fr; }
.scroll-foot-wrap > div { overflow: hidden; min-height: 0; }

/* photo */
.photo { margin: 6px auto 22px; max-width: 360px; padding: 12px 12px 14px; background: #fff; border: 1px solid var(--gold); box-shadow: 0 8px 20px rgba(29, 82, 55, 0.2); transform: rotate(-1.6deg); }
.photo img { display: block; width: 100%; height: auto; }
.photo figcaption { font-family: var(--font-script); font-size: 28px; color: var(--green-deep); text-align: center; padding-top: 8px; line-height: 1.2; }
.photo-empty {
  aspect-ratio: 4 / 5; display: grid; place-items: center; text-align: center; padding: 20px;
  border: 2px dashed var(--gold); color: var(--ink-soft); font-style: italic; font-size: 19px;
  background: repeating-linear-gradient(45deg, var(--paper), var(--paper) 10px, #FFF3C2 10px, #FFF3C2 20px);
}

/* ---------- music toggle ---------- */
.music {
  position: fixed; z-index: 45;
  top: calc(env(safe-area-inset-top, 0px) + var(--frame) + 14px);
  right: calc(env(safe-area-inset-right, 0px) + var(--frame) + 14px);
  all: unset; box-sizing: border-box; cursor: pointer;
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--green-deep); color: var(--gold-lit);
  box-shadow: 0 0 0 3px var(--gold), 0 6px 14px rgba(29, 82, 55, 0.3);
}
.music { position: fixed; z-index: 45; top: calc(env(safe-area-inset-top, 0px) + var(--frame) + 16px); right: calc(env(safe-area-inset-right, 0px) + var(--frame) + 16px); }
.music:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.music svg { width: 22px; height: 22px; fill: var(--gold-lit); }
.music .off { display: none; }
.music.muted .on { display: none; }
.music.muted .off { display: block; }
.music[hidden] { display: none; }

footer { text-align: center; color: var(--ink-soft); font-style: italic; font-size: 19px; }

@media (max-width: 480px) {
  body { font-size: 19px; }
  .paper { padding: 28px 20px 24px; }
  .paper p { font-size: 20px; }
  .head-text strong { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) {
  .scroll-body, .scroll-foot-wrap, .paper, .chev, .gate, .scroll-head, .seal-btn { transition: none; }
}
</style>
</head>

const $ = (id) => document.getElementById(id);
const heartSVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.2 3 4.5 6.6 4.5c2 0 3.5 1 5.4 3 1.9-2 3.4-3 5.4-3 3.6 0 5.7 3.7 4.2 7.3C19.5 16.4 12 21 12 21z"/></svg>';

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function paragraphs(t) { return t.split(/\n\s*\n+/).map((p) => "<p>" + esc(p.trim()).replace(/\*\*(.+?)\*\*/gs, "<strong>$1</strong>").replace(/\n/g, "<br>") + "</p>").join(""); }

$("gate-name").textContent = "for " + SITE.herName;

function photoHTML() {
  if (SITE.photoSrc) {
    return '<figure class="photo"><img src="' + esc(SITE.photoSrc) + '" alt="A photo of us"><figcaption>' + esc(SITE.photoCaption) + "</figcaption></figure>";
  }
  return '<figure class="photo"><div class="photo-empty">Your photo goes here</div><figcaption>' + esc(SITE.photoCaption) + "</figcaption></figure>";
}

function scrollHTML(id, waxInner, title, hint, bodyHTML) {
  return (
    '<article class="scroll" id="' + id + '">' +
      '<button class="scroll-head" type="button" aria-expanded="false" aria-controls="' + id + '-body">' +
        '<span class="wax">' + waxInner + "</span>" +
        '<span class="head-text"><strong>' + esc(title) + "</strong><small>" + hint + "</small></span>" +
        '<span class="chev" aria-hidden="true"></span>' +
      "</button>" +
      '<div class="scroll-body" id="' + id + '-body" role="region"><div class="scroll-clip"><div class="paper">' + bodyHTML + "</div></div></div>" +
      '<div class="scroll-foot-wrap"><div><div class="scroll-foot"><div class="rod"></div></div></div></div>' +
    "</article>"
  );
}

/* ---------- music ---------- */
const audio = $("song");
const musicBtn = $("music");
let playing = false;
let ctx = null, loopTimer = null, step = 0;

/* Soft placeholder melody (Web Audio), used until a real song is attached. */
const NOTES = [392.0, 493.88, 587.33, 659.25, 587.33, 493.88, 440.0, 523.25, 659.25, 783.99, 659.25, 523.25, 392.0, 440.0, 493.88, 587.33];
function tick() {
  if (!ctx) return;
  const t = ctx.currentTime;
  const f = NOTES[step % NOTES.length];
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.07, t + 0.04);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 1.9);
  if (step % 4 === 0) {
    const b = ctx.createOscillator(), bg = ctx.createGain();
    b.type = "triangle"; b.frequency.value = f / 2;
    bg.gain.setValueAtTime(0, t);
    bg.gain.linearRampToValueAtTime(0.05, t + 0.08);
    bg.gain.exponentialRampToValueAtTime(0.0001, t + 3);
    b.connect(bg); bg.connect(ctx.destination);
    b.start(t); b.stop(t + 3.1);
  }
  step++;
}

function setUI(on) {
  playing = on;
  musicBtn.classList.toggle("muted", !on);
  musicBtn.setAttribute("aria-label", on ? "Turn music off" : "Turn music on");
}

async function startMusic() {
  try {
    if (SITE.songSrc) {
      await audio.play();
    } else {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!ctx) ctx = new AC();
      await ctx.resume();
      if (!loopTimer) { tick(); loopTimer = setInterval(tick, 650); }
    }
    setUI(true);
  } catch (e) { setUI(false); }
}
function stopMusic() {
  try {
    if (SITE.songSrc) audio.pause();
    else if (ctx) { clearInterval(loopTimer); loopTimer = null; ctx.suspend(); }
  } catch (e) {}
  setUI(false);
}
if (SITE.songSrc) { audio.src = SITE.songSrc; audio.volume = 0.8; }

musicBtn.addEventListener("click", () => (playing ? stopMusic() : startMusic()));

$("open-btn").addEventListener("click", () => {
  $("gate").classList.add("gone");
  document.body.classList.remove("locked");
  musicBtn.hidden = false;
  startMusic();
  window.scrollTo(0, 0);
});
document.body.classList.add("locked");
